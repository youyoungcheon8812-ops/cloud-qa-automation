name: QA Automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run API tests
        run: pytest -m api --html=reports/api-report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/

  ui-test:
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run UI tests
        run: >
          pytest -m ui --html=reports/ui-report.html --self-contained-html
          --screenshot only-on-failure --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report
          path: |
            reports/
            test-results/
